services:
  # DATABASE: Porta 5433 per evitare conflitti con il sistema host
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: humflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d humflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - humflow-network

  # CACHE & BROKER
  redis:
    image: redis:7-alpine
    networks:
      - humflow-network

  # MAIL TESTER
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - humflow-network

  # BACKEND API
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    environment:
      - JWT_SECRET_KEY=humflow_super_secret_key_cambiami_in_produzione
      - INTERNAL_API_SECRET=internal-secret-change-me-in-production
      - DATABASE_URL=postgresql://admin:password@db:5432/humflow
      - REDIS_URL=redis://redis:6379/0
      - SMTP_SERVER=mailhog
      - SMTP_PORT=1025
      - IMAP_SERVER=mailhog
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - humflow-network

  # CELERY WORKER
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --beat --loglevel=info
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      - INTERNAL_API_SECRET=internal-secret-change-me-in-production
      - DATABASE_URL=postgresql://admin:password@db:5432/humflow
      - REDIS_URL=redis://redis:6379/0
      - SMTP_SERVER=mailhog
      - SMTP_PORT=1025
      # --- Pipeline AI locale (alternativa a Groq, vedi .env.example) ---
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - humflow-network

  # AI LOCALE — pipeline leggera solo testo, alternativa a Groq per PC senza GPU dedicata
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - humflow-network
    # Se hai una GPU NVIDIA con il Container Toolkit installato, scommenta per accelerare:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # FRONTEND REACT
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    networks:
      - humflow-network

networks:
  humflow-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  ollama_data: